version: 2

# Action は可変タグではなく commit SHA で参照している。乗っ取られたタグが
# 貼り替えられてもランナー上で他人のコードが走らない代わりに、更新が止まる。
# SHA の追従はここに任せる。
#
# dependencies は空だが、devDependencies（TypeScript・@types/node）の追従を
# bun エコシステムで回す。
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps

name: test

on: [push, pull_request]

jobs:
  # ランナー標準の python3 で動くこと自体がこのパッケージの要件なので、
  # このジョブでは意図的に Python をセットアップしない。
  default-python:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Show the interpreter under test
        run: python3 -VV
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

  # 宣言している最小サポート版。ここが無いと、engines に 3.8 と書きながら
  # 3.8 で動くことを誰も確かめていない状態になる。
  minimum-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

  # files に挙げたファイルが実際に同梱されるかを確認する。
  # 作業ツリーには未コミットのファイルが存在しうるため、
  # クリーンチェックアウトで確かめる意味がある。
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Show what would be published
        run: npm pack --dry-run
      - name: Every file listed in "files" must exist
        run: |
          node -e '
            const fs = require("fs");
            const missing = require("./package.json").files
              .filter((f) => !fs.existsSync(f.replace(/\/$/, "")));
            if (missing.length) {
              console.error("missing from the checkout: " + missing.join(", "));
              process.exit(1);
            }
            console.log("all files present");
          '
      - name: The tarball must not contain tests, CI, docs or agent definitions
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e '
            const files = require("/tmp/pack.json")[0].files.map((f) => f.path);
            const leaked = files.filter((p) =>
              /^(tests|\.github|docs|handover|\.claude)\//.test(p));
            if (leaked.length) {
              console.error("leaked into the tarball: " + leaked.join(", "));
              process.exit(1);
            }
            console.log("tarball contents: " + files.join(", "));
          '
